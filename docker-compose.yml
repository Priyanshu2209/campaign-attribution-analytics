services:
  db:
    image: postgres:17              # PostgreSQL version 17
    container_name: campaign_db     # a friendly name for the container
    restart: unless-stopped         # restarts automatically if it crashes
    env_file: .env                  # reads user/password/db name from .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # your computer's port : container's port
    volumes:
      - pgdata:/var/lib/postgresql/data # keeps your data when the container stops
      - ./db:/db                        # shares your db/ folder with the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  